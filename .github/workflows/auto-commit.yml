name: Daily AI Code Updater (MiniMax)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm init -y

      - name: Run AI Agent
        env:
          MINIMAX_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: node auto-agent.js

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: automated daily update by MiniMax AI [skip ci]"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi